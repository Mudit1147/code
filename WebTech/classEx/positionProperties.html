<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .image-row {
            display: flex;
            gap: 3px;
        }

        .image-row img {
            width: 25%;
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="image-row">
        <img src="https://picsum.photos/id/1015/300/200" alt="Mountain landscape">
        <img src="https://picsum.photos/id/1016/300/200" alt="Forest landscape">
        <img src="https://picsum.photos/id/1018/300/200" alt="River landscape">
        <img src="https://picsum.photos/id/1025/300/200" alt="Dog outdoors">
    </div>
</body>
</html>
